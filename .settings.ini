# settings.ini
[Settings]
;Token необходимо получить при создании бота от @BotFather
token=bot_token
;Название таблицы может быть любым, т.к. она будет создана и храниться локально в папке проекта
db_name=name_db
;То как будет объявляться победитель в конце месяца, допустимые значения top1/top3
winner_calculate=top1
;Прокси для всех исходящих вызовов Telegram API (long-poll + sendMessage).
;Формат: http://user:pass@host:port. Спецсимволы в логине/пароле (@ : / # и т.п.)
;нужно percent-encode-нуть. Литеральный '%' в пароле в этом ini-файле надо
;удвоить как '%%' (ограничение configparser). Оставьте пустым — и трафик
;пойдёт напрямую.
proxy=http://some-proxy.com
[TelegramData]
;ID группового чата, который можно получить от @getmyid_bot, добавив его в Ваш чат
group_chat_id=group_chat
;ID чата хозяина бота, ID можно получить от @getmyid_bot, написав ему в личном сообщении
owner_chat_id=owner_chat
;Имя бота после @ в тг, для отображения в сообщениях
bot_username=bot_username
